[project]
name = "codeagent-mcp"
version = "0.1.0"
description = "Multi-Agent Collaborative Code Development System via MCP Protocol"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ChengXie"}]

dependencies = [
    "openai>=1.0",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
rag = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
